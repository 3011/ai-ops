apiVersion: v1
kind: Namespace
metadata:
  name: aiops-dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aiops-dev-quota
  namespace: aiops-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    requests.storage: 10Gi
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops-dev
data:
  ENVIRONMENT: development
  PROMETHEUS_URL: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  LOKI_URL: http://loki.monitoring.svc:3100
  ALERTMANAGER_URL: http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093
  LLM_BASE_URL: https://api.deepseek.com
  LLM_MODEL: deepseek-v4-flash
  WORKER_POLL_SECONDS: "2"
  DYNAMIC_PLANNER_ENABLED: "true"
  DYNAMIC_PLANNER_MAX_PROMETHEUS_QUERIES: "4"
  DYNAMIC_PLANNER_MAX_LOKI_QUERIES: "2"
  CHANGE_LOOKBACK_MINUTES: "120"
  TRACE_QUERY_LIMIT: "20"
  APP_VERSION: "0.8.0"
  APP_RELEASE_TITLE: "OOMKilled 可信调查闭环"
  APP_RELEASE_SUMMARY: "新增不依赖模型的 OOMKilled 确定性调查、工具审计、UID 固定和规则化诊断。"
  APP_RELEASE_CHANGES: '["TargetContext 固定 Pod UID 与 Container","get_container_termination_status 只读工具","ToolExecution 与原始结果 Hash 审计","container_oom_killed_v1 确定性 Finding","模型关闭时仍生成 COMPLETED_PARTIAL 诊断","事件详情可信调查页面"]'
  SESSION_HOURS: "8"
  COOKIE_SECURE: "false"
