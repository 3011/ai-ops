apiVersion: v1
kind: Namespace
metadata:
  name: aiops-dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aiops-dev-quota
  namespace: aiops-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    requests.storage: 10Gi
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops-dev
data:
  ENVIRONMENT: development
  PROMETHEUS_URL: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  LOKI_URL: http://loki.monitoring.svc:3100
  ALERTMANAGER_URL: http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093
  LLM_BASE_URL: https://api.deepseek.com
  LLM_MODEL: deepseek-v4-flash
  WORKER_POLL_SECONDS: "2"
  DYNAMIC_PLANNER_ENABLED: "true"
  DYNAMIC_PLANNER_MAX_PROMETHEUS_QUERIES: "4"
  DYNAMIC_PLANNER_MAX_LOKI_QUERIES: "2"
  CHANGE_LOOKBACK_MINUTES: "120"
  TRACE_QUERY_LIMIT: "20"
  INVESTIGATION_RAW_JSON_MAX_BYTES: "65536"
  INVESTIGATION_COLLECTION_MAX_ITEMS: "200"
  INVESTIGATION_STRING_MAX_CHARS: "4000"
  APP_VERSION: "0.9.0-dev.2"
  APP_RELEASE_TITLE: "应用与关联可信工具"
  APP_RELEASE_SUMMARY: "新增受 TargetContext 约束的内存、CPU 和 throttling 工具，并建立无 Agent 的 CPU Spike 确定性调查。"
  APP_RELEASE_CHANGES: '["容器重启历史","Deployment rollout 与 CI/CD 时间关联","受控日志类别与 Prompt Injection 隔离","Workload UID 副本 CPU 比较","有限 Profile 应用 RED 指标","完整 5/7 工具无 Agent 固定计划","Gate 3 多副本真实场景"]'
  SESSION_HOURS: "8"
  COOKIE_SECURE: "false"
