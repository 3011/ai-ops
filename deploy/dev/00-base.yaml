apiVersion: v1
kind: Namespace
metadata:
  name: aiops-dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aiops-dev-quota
  namespace: aiops-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    requests.storage: 10Gi
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops-dev
data:
  ENVIRONMENT: development
  PROMETHEUS_URL: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  LOKI_URL: http://loki.monitoring.svc:3100
  ALERTMANAGER_URL: http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093
  LLM_BASE_URL: https://api.deepseek.com
  LLM_MODEL: deepseek-v4-flash
  WORKER_POLL_SECONDS: "2"
  DYNAMIC_PLANNER_ENABLED: "true"
  DYNAMIC_PLANNER_MAX_PROMETHEUS_QUERIES: "4"
  DYNAMIC_PLANNER_MAX_LOKI_QUERIES: "2"
  CHANGE_LOOKBACK_MINUTES: "120"
  TRACE_QUERY_LIMIT: "20"
  APP_VERSION: "0.7.0"
  APP_RELEASE_TITLE: "平台治理与总览体验升级"
  APP_RELEASE_SUMMARY: "新增用户、角色、权限、审计和版本说明，并重新设计运维总览。"
  APP_RELEASE_CHANGES: '["运维总览卡片重新分组与响应式优化","HttpOnly 会话登录和首次密码修改","用户、角色和细粒度权限管理","关键管理操作审计日志","版本说明与历史里程碑记录"]'
  SESSION_HOURS: "8"
  COOKIE_SECURE: "false"
