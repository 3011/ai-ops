apiVersion: v1
kind: Namespace
metadata:
  name: aiops-dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aiops-dev-quota
  namespace: aiops-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    requests.storage: 10Gi
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops-dev
data:
  ENVIRONMENT: development
  PROMETHEUS_URL: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  LOKI_URL: http://loki.monitoring.svc:3100
  ALERTMANAGER_URL: http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093
  LLM_BASE_URL: https://api.deepseek.com
  LLM_MODEL: deepseek-v4-flash
  WORKER_POLL_SECONDS: "2"
  DYNAMIC_PLANNER_ENABLED: "true"
  DYNAMIC_PLANNER_MAX_PROMETHEUS_QUERIES: "4"
  DYNAMIC_PLANNER_MAX_LOKI_QUERIES: "2"
  CHANGE_LOOKBACK_MINUTES: "120"
  TRACE_QUERY_LIMIT: "20"
  INVESTIGATION_RAW_JSON_MAX_BYTES: "65536"
  INVESTIGATION_COLLECTION_MAX_ITEMS: "200"
  INVESTIGATION_STRING_MAX_CHARS: "4000"
  APP_VERSION: "0.9.0-dev.4"
  APP_RELEASE_TITLE: "冻结调查输入与历史 Replay 适配"
  APP_RELEASE_SUMMARY: "在 AnalysisRun 创建时冻结真实输入，并使用版本化适配器恢复 0.8.x/0.9.x 历史 Replay。"
  APP_RELEASE_CHANGES: '["AnalysisRun 原生输入冻结","数据库不可变触发器","native_frozen/historical_reconstructed/legacy_incomplete 来源模式","0.8.x 与 0.9.x 历史输入适配","Incident 后续变化不影响旧 Snapshot","真实 legacy contract violation 保留"]'
  SESSION_HOURS: "8"
  COOKIE_SECURE: "false"
