apiVersion: v1
kind: Namespace
metadata:
  name: aiops-dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aiops-dev-quota
  namespace: aiops-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    requests.storage: 10Gi
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops-dev
data:
  ENVIRONMENT: development
  PROMETHEUS_URL: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  LOKI_URL: http://loki.monitoring.svc:3100
  ALERTMANAGER_URL: http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093
  LLM_BASE_URL: https://api.deepseek.com
  LLM_MODEL: deepseek-v4-flash
  WORKER_POLL_SECONDS: "2"
  DYNAMIC_PLANNER_ENABLED: "true"
  DYNAMIC_PLANNER_MAX_PROMETHEUS_QUERIES: "4"
  DYNAMIC_PLANNER_MAX_LOKI_QUERIES: "2"
  CHANGE_LOOKBACK_MINUTES: "120"
  TRACE_QUERY_LIMIT: "20"
  INVESTIGATION_RAW_JSON_MAX_BYTES: "65536"
  INVESTIGATION_COLLECTION_MAX_ITEMS: "200"
  INVESTIGATION_STRING_MAX_CHARS: "4000"
  APP_VERSION: "0.8.1"
  APP_RELEASE_TITLE: "可信 Tool Runtime 加固"
  APP_RELEASE_SUMMARY: "将单工具调查重构为通用注册、预算、缓存、失败语义和 Artifact 管线。"
  APP_RELEASE_CHANGES: '["ToolRegistry 与通用 ToolRuntime.execute","InvestigationBudget 与 BudgetLedger","同 Run、同 Target、同参数缓存复用","Kubernetes 404/403/429/5xx/超时精确语义","Resolver 分页、直接 GET 与 controller owner","Finding 自动回填 ToolResult","Artifact 脱敏、截断、压缩和完整 Hash"]'
  SESSION_HOURS: "8"
  COOKIE_SECURE: "false"
