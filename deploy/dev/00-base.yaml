apiVersion: v1
kind: Namespace
metadata:
  name: aiops-dev
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aiops-dev-quota
  namespace: aiops-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    requests.storage: 10Gi
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops-dev
data:
  ENVIRONMENT: development
  PROMETHEUS_URL: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  LOKI_URL: http://loki.monitoring.svc:3100
  ALERTMANAGER_URL: http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093
  LLM_BASE_URL: https://api.deepseek.com
  LLM_MODEL: deepseek-v4-flash
  WORKER_POLL_SECONDS: "2"
  DYNAMIC_PLANNER_ENABLED: "true"
  DYNAMIC_PLANNER_MAX_PROMETHEUS_QUERIES: "4"
  DYNAMIC_PLANNER_MAX_LOKI_QUERIES: "2"
  CHANGE_LOOKBACK_MINUTES: "120"
  TRACE_QUERY_LIMIT: "20"
  INVESTIGATION_RAW_JSON_MAX_BYTES: "65536"
  INVESTIGATION_COLLECTION_MAX_ITEMS: "200"
  INVESTIGATION_STRING_MAX_CHARS: "4000"
  INVESTIGATION_MODE: "shadow"
  AGENT_MODEL_TIMEOUT_SECONDS: "45"
  APP_VERSION: "0.9.0"
  APP_RELEASE_TITLE: "可信 Agent Shadow 调查与离线重放"
  APP_RELEASE_SUMMARY: "在确定性调查之外增加独立 Agent Shadow、离线 Snapshot Replay、模型调用审计、比较界面和安全评估门槛。"
  APP_RELEASE_CHANGES: '["框架无关 InvestigationAgent Protocol","Agent 输入输出契约与独立校验","模型请求响应 Artifact 审计","离线 Snapshot Agent Replay","独立实时 Agent Shadow Run","确定性与 Agent 比较界面","OOM/CPU 安全与效果评估门槛","默认 investigation_mode=shadow"]'
  SESSION_HOURS: "8"
  COOKIE_SECURE: "false"
