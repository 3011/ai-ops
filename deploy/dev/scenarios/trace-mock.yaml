apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-trace-mock
  namespace: aiops-dev
  labels: {app: aiops-trace-mock, aiops_test: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app: aiops-trace-mock}
  template:
    metadata:
      labels: {app: aiops-trace-mock, aiops_test: "true"}
    spec:
      containers:
        - name: mock
          image: python:3.12-slim
          command:
            - python
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body=json.dumps({"traces":[{"traceID":"trace-rollout-test-001","rootServiceName":"aiops-scenario-rollout","rootTraceName":"GET /health","startTimeUnixNano":"1784091124000000000","durationMs":123.4,"spanSets":[]}]}).encode()
                      self.send_response(200); self.send_header("Content-Type","application/json"); self.send_header("Content-Length",str(len(body))); self.end_headers(); self.wfile.write(body)
                  def log_message(self,*args): pass
              HTTPServer(("0.0.0.0",3200),H).serve_forever()
          ports: [{containerPort: 3200}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-trace-mock
  namespace: aiops-dev
spec:
  selector: {app: aiops-trace-mock}
  ports: [{port: 3200, targetPort: 3200}]
