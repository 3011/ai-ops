apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: aiops-dev
spec:
  selector: {app: postgresql}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: aiops-dev
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels: {app: postgresql}
  template:
    metadata:
      labels: {app: postgresql}
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: postgresql
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_DB, value: aiops}
            - {name: POSTGRES_USER, value: aiops}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: aiops-secrets, key: POSTGRES_PASSWORD}}
          ports:
            - {containerPort: 5432, name: postgres}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U aiops -d aiops"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U aiops -d aiops"]}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources: {requests: {storage: 5Gi}}
