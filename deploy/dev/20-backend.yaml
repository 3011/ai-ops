apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-api
  namespace: aiops-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: aiops-api}
  template:
    metadata:
      labels: {app: aiops-api}
    spec:
      nodeSelector: {kubernetes.io/hostname: k8s-cp01}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      initContainers:
        - name: install-dependencies
          image: python:3.12-slim
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          command: ["sh", "-ec", "pip install --no-cache-dir --target=/deps -r /workspace/requirements.txt"]
          volumeMounts:
            - {name: source, mountPath: /workspace, readOnly: true}
            - {name: python-deps, mountPath: /deps}
      containers:
        - name: api
          image: python:3.12-slim
          workingDir: /workspace
          command: ["sh", "-ec", "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
          envFrom:
            - {configMapRef: {name: aiops-config}}
            - {secretRef: {name: aiops-secrets}}
          env:
            - {name: PYTHONPATH, value: /deps:/workspace}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: source, mountPath: /workspace}
            - {name: python-deps, mountPath: /deps}
      volumes:
        - name: source
          hostPath: {path: /root/aiops-console/backend, type: Directory}
        - name: python-deps
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-api
  namespace: aiops-dev
spec:
  type: NodePort
  selector: {app: aiops-api}
  ports:
    - {name: http, port: 8000, targetPort: http, nodePort: 30801}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-worker
  namespace: aiops-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: aiops-worker}
  template:
    metadata:
      labels: {app: aiops-worker}
    spec:
      nodeSelector: {kubernetes.io/hostname: k8s-cp01}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      initContainers:
        - name: install-dependencies
          image: python:3.12-slim
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          command: ["sh", "-ec", "pip install --no-cache-dir --target=/deps -r /workspace/requirements.txt"]
          volumeMounts:
            - {name: source, mountPath: /workspace, readOnly: true}
            - {name: python-deps, mountPath: /deps}
      containers:
        - name: worker
          image: python:3.12-slim
          workingDir: /workspace
          command: ["sh", "-ec", "python -m app.worker"]
          envFrom:
            - {configMapRef: {name: aiops-config}}
            - {secretRef: {name: aiops-secrets}}
          env:
            - {name: PYTHONPATH, value: /deps:/workspace}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: source, mountPath: /workspace}
            - {name: python-deps, mountPath: /deps}
      volumes:
        - name: source
          hostPath: {path: /root/aiops-console/backend, type: Directory}
        - name: python-deps
          emptyDir: {}
